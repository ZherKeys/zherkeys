<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ZherTalk — Assistente</title>
  <style>
    :root{
      --bg:#071027; --panel:#03111b; --muted:#93c5fd; --accent:#3B82F6; --accent-2:#F43F5E; --user:#0f1724; --bot:#07273a;
      --radius:12px; --glass: rgba(255,255,255,0.03);
    }
    *{box-sizing:border-box}
    body{font-family:Inter,Inter var,Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#020617 0%, #071026 100%);color:#e6eef8;margin:0;padding:0;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .container{width:100%;max-width:920px;padding:18px}
    .panel{background:var(--panel);border-radius:14px;box-shadow:0 10px 40px rgba(2,6,23,.6);overflow:hidden;border:1px solid rgba(255,255,255,0.03)}
    header.chat-header{display:flex;align-items:center;gap:12px;padding:14px 18px;background:linear-gradient(90deg, rgba(59,130,246,0.06), rgba(244,63,94,0.03));border-bottom:1px solid rgba(255,255,255,0.02)}
    header h1{font-size:16px;margin:0;font-weight:700}
    header p{margin:0;color:var(--muted);font-size:13px}

    .messages{height:60vh;min-height:320px;max-height:70vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg, transparent, rgba(0,0,0,0.02));}

    .bubble{max-width:82%;padding:12px 14px;border-radius:12px;line-height:1.45;white-space:pre-wrap}
    .row{display:flex;gap:10px;align-items:flex-end}
    .row.user{justify-content:flex-end}
    .avatar{width:36px;height:36px;border-radius:10px;flex:0 0 36px;display:inline-flex;align-items:center;justify-content:center;background:var(--glass);color:var(--muted);font-weight:700}
    .bubble.user{background:linear-gradient(90deg,var(--accent),#1fb6ff);border-radius:12px 12px 8px 12px;color:#021124;text-align:right}
    .bubble.bot{background:linear-gradient(180deg,#082437,#07202b);border:1px solid rgba(255,255,255,0.02);color:#e6eef8}

    .meta{font-size:11px;color:var(--muted);margin-top:6px}

    .composer{display:flex;gap:8px;padding:12px;border-top:1px solid rgba(255,255,255,0.03);background:linear-gradient(180deg,rgba(255,255,255,0.01),transparent)}
    .composer input{flex:1;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit}
    .composer button{padding:10px 14px;border-radius:10px;border:none;background:var(--accent);color:#021124;font-weight:700;cursor:pointer}
    .composer .secondary{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted)}

    .toolbar{display:flex;gap:8px;padding:12px;border-bottom:1px solid rgba(255,255,255,0.02);align-items:center}
    .chip{background:transparent;border:1px solid rgba(255,255,255,0.04);padding:6px 10px;border-radius:999px;color:var(--muted);cursor:pointer;font-size:13px}

    .small{font-size:13px;color:var(--muted)}

    @media (max-width:720px){
      .container{padding:12px}
      .messages{height:56vh;padding:12px}
      .avatar{display:none}
      .bubble{max-width:100%}
    }
  </style>

<body>`n    <!-- Google AdSense Auto Ads Body Tag -->`n    <amp-auto-ads type="adsense" data-ad-client="ca-pub-3654713194554139"></amp-auto-ads>
  <div class="container">
    <div class="panel">
      <header class="chat-header">
        <div style="display:flex;flex-direction:column">
          <h1>ZherTalk</h1>
          <p class="small">Converse com o assistente — respostas diretas, claras e com fontes quando disponível.</p>
        </div>
        <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
          <button id="clearBtn" class="chip">Limpar</button>
          <button id="copyBtn" class="chip">Copiar última</button>
        </div>
      </header>

      <div class="toolbar">
        <div class="small">Estilo de resposta:</div>
        <button class="chip" data-style="direct">Direto</button>
        <button class="chip" data-style="explain">Explique passo a passo</button>
        <button class="chip" data-style="concise">Conciso</button>
        <div style="flex:1"></div>
        <div class="small">Admin: <button id="studyBtnTop" class="chip">Solicitar estudo</button></div>
      </div>

      <main id="messages" class="messages" role="log" aria-live="polite"></main>

      <div class="composer">
        <input id="inputMsg" type="text" placeholder="Pergunte algo ao ZherTalk... (Enter para enviar)">
        <button id="sendBtn">Enviar</button>
      </div>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const input = document.getElementById('inputMsg');
    const sendBtn = document.getElementById('sendBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');
    const styleChips = Array.from(document.querySelectorAll('.chip[data-style]'));
    const studyBtnTop = document.getElementById('studyBtnTop');

    let replyStyle = 'direct';

    styleChips.forEach(c=>c.addEventListener('click', ()=>{ styleChips.forEach(x=>x.classList.remove('active')); c.classList.add('active'); replyStyle = c.dataset.style; }));
    // mark default
    document.querySelector('.chip[data-style="direct"]').classList.add('active');

    function formatMeta(){ const d=new Date(); return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }

    function createRow(role, text){
      const row = document.createElement('div'); row.className = 'row ' + (role==='user'?'user':'bot');
      const avatar = document.createElement('div'); avatar.className='avatar'; avatar.textContent = role==='user'?'TU':'ZH';
      const bubble = document.createElement('div'); bubble.className = 'bubble ' + (role==='user'?'user':'bot');
      bubble.innerHTML = text || '';
      const container = document.createElement('div'); container.style.display='flex'; container.style.flexDirection='column'; container.appendChild(bubble);
      const meta = document.createElement('div'); meta.className='meta'; meta.textContent = formatMeta(); container.appendChild(meta);
      if(role==='user'){
        row.appendChild(container);
      } else {
        row.appendChild(avatar); row.appendChild(container);
      }
      messagesEl.appendChild(row); messagesEl.scrollTop = messagesEl.scrollHeight; return bubble;
    }

    function typeText(el, text, speed=18){
      el.textContent=''; let i=0; const t = setInterval(()=>{ i++; el.textContent = text.slice(0,i); messagesEl.scrollTop = messagesEl.scrollHeight; if(i>=text.length) clearInterval(t); }, speed);
    }

    async function sendMessage(message){
      if(!message) return;
      // append user
      createRow('user', escapeHtml(message));
      input.value='';
      // placeholder bot
      const botEl = createRow('bot', '');
      botEl.textContent = 'Pensando...';
      try{
        const res = await fetch('/api/zhertalk/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message,style:replyStyle})});
        const j = await res.json();
        botEl.textContent='';
        if(j.error){ botEl.textContent = 'Erro: '+j.error; }
        else if(j.reply){ typeText(botEl, j.reply, 14); }
        else { botEl.textContent = 'Sem resposta.'; }
      }catch(e){ botEl.textContent = 'Erro ao conectar.'; }
    }

    function escapeHtml(s){ return s.replaceAll('<','&lt;').replaceAll('>','&gt;'); }

    sendBtn.addEventListener('click', ()=> sendMessage(input.value.trim()));
    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); sendBtn.click(); } });

    clearBtn.addEventListener('click', ()=>{ messagesEl.innerHTML=''; });
    copyBtn.addEventListener('click', ()=>{
      const botRows = [...messagesEl.querySelectorAll('.row.bot')];
      if(botRows.length===0) return alert('Sem texto para copiar');
      const last = botRows[botRows.length-1];
      const text = last.querySelector('.bubble')?.textContent || '';
      if(!text) return alert('Sem texto para copiar');
      navigator.clipboard.writeText(text).then(()=>alert('Copiado para área de transferência'));
    });

    studyBtnTop.addEventListener('click', async ()=>{
      const q = prompt('Tópico ou URL para estudo (admin):');
      if(!q) return; studyBtnTop.classList.add('disabled');
      try{
        const r = await fetch('/api/zhertalk/study',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:q})});
        const j = await r.json();
        if(j.success) alert('Estudo solicitado e salvo.'); else alert('Falha: '+(j.error||'desconhecido'));
      }catch(e){ alert('Erro ao solicitar estudo'); }
      studyBtnTop.classList.remove('disabled');
    });

    // welcome
    (function(){ const welcomeBubble = createRow('bot',''); typeText(welcomeBubble, 'Olá — eu sou o ZherTalk. Pergunte algo ou peça para eu estudar um tópico (admin). Respondo de forma direta e objetiva.'); })();
  </script>
</body>
</html>
