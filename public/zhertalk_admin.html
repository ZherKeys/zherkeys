<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ZherTalk Admin</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;background:#071026;color:#e6eef8;padding:20px} .box{background:#03111b;padding:16px;border-radius:8px;margin-bottom:12px} textarea{width:100%;height:160px;background:#071424;color:#e6eef8;border:1px solid #123;padding:8px;border-radius:6px}</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18202657831">
</script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'AW-18202657831');
</script>
</head>
<body>
  <h1>ZherTalk — Administração</h1>
  <div class="box">
    <h3>Conhecimento salvo</h3>
    <div id="kb"></div>
  </div>

  <div class="box">
    <h3>Logs</h3>
    <pre id="logs" style="max-height:200px;overflow:auto"></pre>
  </div>

  <div class="box">
    <h3>Solicitar alteração de código (gera código por email)</h3>
    <label>Arquivo (relativo ao projeto):</label>
    <input id="filePath" style="width:100%" placeholder="public/somefile.html">
    <label>Mensagem de commit:</label>
    <input id="commitMsg" style="width:100%" placeholder="Descrição da alteração">
    <label>Conteúdo novo do arquivo:</label>
    <textarea id="newContent"></textarea>
    <button id="reqChange">Solicitar alteração</button>
  </div>

  <div class="box">
    <h3>Confirmar código</h3>
    <input id="confirmCode" placeholder="Código recebido por email">
    <button id="confirmBtn">Confirmar e aplicar</button>
  </div>

  <script>
    async function loadKB(){
      const r = await fetch('/api/zhertalk/knowledge');
      const data = await r.json();
      const el = document.getElementById('kb'); el.innerHTML='';
      data.forEach(i=>{
        const d = document.createElement('div'); d.style.borderTop='1px solid #0b2130'; d.style.padding='8px 0';
        d.innerHTML = `<b>${i.query}</b> <button data-id="${i.id}">Excluir</button><pre style="white-space:pre-wrap">${i.content}</pre>`;
        el.appendChild(d);
        d.querySelector('button').onclick = async ()=>{
          if(!confirm('Excluir item?')) return;
          const res = await fetch('/api/zhertalk/knowledge/'+i.id,{method:'DELETE'});
          const j = await res.json(); if(j.success) loadKB(); else alert('Erro');
        };
      });
    }
    async function loadLogs(){
      const r = await fetch('/api/zhertalk/logs'); const j = await r.json(); document.getElementById('logs').textContent = JSON.stringify(j,null,2);
    }
    document.getElementById('reqChange').onclick = async ()=>{
      const filePath = document.getElementById('filePath').value.trim(); const newContent = document.getElementById('newContent').value; const commitMessage = document.getElementById('commitMsg').value;
      if(!filePath || !newContent) return alert('Arquivo e conteúdo obrigatórios');
      const r = await fetch('/api/zhertalk/request-code-change',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({filePath,newContent,commitMessage})});
      const j = await r.json(); if(j.success) alert('Código enviado por email. Verifique e confirme.'); else alert('Erro: '+(j.error||''));
    };
    document.getElementById('confirmBtn').onclick = async ()=>{
      const code = document.getElementById('confirmCode').value.trim(); if(!code) return alert('Digite o código');
      const r = await fetch('/api/zhertalk/confirm-code-change',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code})});
      const j = await r.json(); if(j.success) alert('Alteração aplicada e enviada ao git.'); else alert('Erro: '+(j.error||JSON.stringify(j)));
      loadLogs(); loadKB();
    };

    loadKB(); loadLogs();
  </script>
</body>
</html>
