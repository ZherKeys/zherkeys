<body class="text-slate-200 antialiased mesh-bg min-h-screen flex items-center justify-center p-4">`n    <!-- Google AdSense Auto Ads Body Tag -->`n    <amp-auto-ads type="adsense" data-ad-client="ca-pub-3654713194554139"></amp-auto-ads>

    <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl p-8 shadow-2xl relative overflow-hidden">
        <div class="text-center mb-8">
            <div class="w-12 h-12 mx-auto rounded-lg bg-gradient-to-tr from-cyberrose to-orange-500 flex items-center justify-center shadow-lg mb-4">
                <i data-lucide="key" class="w-6 h-6 text-white"></i>
            </div>
            <h2 class="font-orbitron font-black text-2xl tracking-widest text-white uppercase">REDEFINIR SENHA</h2>
            <p class="text-slate-400 text-xs font-orbitron tracking-widest mt-1">CRIE UMA NOVA CREDENCIAL</p>
        </div>

        <div id="alert-box" class="hidden mb-6 p-3 rounded text-sm text-center font-bold"></div>

        <form id="reset-form" class="space-y-5" onsubmit="handleReset(event)">
            <div>
                <label class="block text-xs font-orbitron text-slate-400 mb-2 tracking-widest">NOVA SENHA</label>
                <div class="relative">
                    <i data-lucide="lock" class="w-5 h-5 absolute left-3 top-3 text-slate-500"></i>
                    <input type="password" id="new-password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg py-3 pl-10 pr-4 text-white placeholder-slate-600 focus:outline-none focus:border-cyberrose transition-colors" placeholder="••••••••">
                </div>
            </div>
            <div>
                <label class="block text-xs font-orbitron text-slate-400 mb-2 tracking-widest">CONFIRME A SENHA</label>
                <div class="relative">
                    <i data-lucide="lock" class="w-5 h-5 absolute left-3 top-3 text-slate-500"></i>
                    <input type="password" id="confirm-password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg py-3 pl-10 pr-4 text-white placeholder-slate-600 focus:outline-none focus:border-cyberrose transition-colors" placeholder="••••••••">
                </div>
            </div>
            <button type="submit" class="w-full bg-cyberrose hover:bg-rose-600 text-white font-orbitron text-xs tracking-widest font-bold py-4 rounded-lg shadow-lg shadow-cyberrose/30 transition-all uppercase flex items-center justify-center gap-2">
                SALVAR NOVA SENHA <i data-lucide="save" class="w-4 h-4"></i>
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="/login.html" class="text-xs font-orbitron text-slate-500 hover:text-white transition-colors tracking-widest">VOLTAR PARA O LOGIN</a>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function showAlert(msg, isError) {
            const box = document.getElementById('alert-box');
            box.innerText = msg;
            box.className = `mb-6 p-3 rounded text-sm text-center font-bold ${isError ? 'bg-red-500/20 text-red-400 border border-red-500/50' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/50'}`;
            box.classList.remove('hidden');
        }

        async function handleReset(e) {
            e.preventDefault();
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const pass1 = document.getElementById('new-password').value;
            const pass2 = document.getElementById('confirm-password').value;

            if(!token) {
                showAlert('Token de segurança ausente. Tente clicar no link do e-mail novamente.', true);
                return;
            }

            if(pass1 !== pass2) {
                showAlert('As senhas não coincidem.', true);
                return;
            }

            try {
                const res = await fetch('/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword: pass1 })
                });
                const data = await res.json();
                
                if(!res.ok) showAlert(data.error, true);
                else {
                    showAlert(data.message, false);
                    document.getElementById('reset-form').reset();
                    setTimeout(() => window.location.href = '/login.html', 3000);
                }
            } catch(err) {
                showAlert('Erro de conexão.', true);
            }
        }
    </script>
</body>
