<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZHER KEYS | Minha Conta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { orbitron: ['Orbitron', 'sans-serif'], inter: ['Inter', 'sans-serif'] },
                    colors: { obsidian: '#020617', cyberrose: '#F43F5E', electricblue: '#3B82F6' },
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; }
        .mesh-bg {
            background-color: #020617;
            background-image: 
                radial-gradient(at 10% 20%, rgba(59, 130, 246, 0.18) 0px, transparent 50%),
                radial-gradient(at 90% 10%, rgba(244, 63, 94, 0.15) 0px, transparent 50%);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3B82F6; }
    </style>
</head>
<body class="text-slate-200 antialiased mesh-bg min-h-screen">

    <nav class="border-b border-slate-800 bg-obsidian/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-electricblue to-cyberrose flex items-center justify-center shadow-lg shadow-cyberrose/20 group-hover:shadow-electricblue/40 transition-all duration-300">
                    <i data-lucide="key" class="w-5 h-5 text-white"></i>
                </div>
                <div>
                    <h1 class="font-orbitron font-black text-xl tracking-widest text-white uppercase">ZHER KEYS</h1>
                </div>
            </a>
            
            <div class="flex items-center gap-4">
                <a id="nav-admin-btn" href="/admin.html" class="hidden text-slate-400 hover:text-toxicgreen transition-colors flex items-center gap-2 font-orbitron text-xs tracking-widest" title="Painel Admin">
                    <i data-lucide="shield" class="w-4 h-4"></i> ADMIN
                </a>
                <a href="/logout" class="text-slate-400 hover:text-cyberrose transition-colors flex items-center gap-2 font-orbitron text-xs tracking-widest" title="Desconectar">
                    <i data-lucide="power" class="w-4 h-4"></i> SAIR
                </a>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-12 flex flex-col md:flex-row gap-8">
        
        <!-- Sidebar -->
        <div class="w-full md:w-64 flex-shrink-0">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sticky top-28">
                <div class="flex items-center gap-3 mb-6 p-2 border-b border-slate-800 pb-4">
                    <div class="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center border border-slate-700">
                        <i data-lucide="user" class="w-6 h-6 text-slate-400"></i>
                    </div>
                    <div>
                        <p class="font-orbitron text-xs text-slate-500 tracking-widest">BEM-VINDO</p>
                        <p id="user-email" class="text-sm font-semibold text-white truncate max-w-[150px]">carregando...</p>
                    </div>
                </div>

                <div class="space-y-2">
                    <button onclick="switchTab('compras')" id="btn-compras" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg bg-electricblue/10 text-electricblue font-orbitron text-xs tracking-widest transition-colors">
                        <i data-lucide="shopping-bag" class="w-4 h-4"></i> MINHAS COMPRAS
                    </button>
                    <button onclick="switchTab('configuracoes')" id="btn-configuracoes" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white font-orbitron text-xs tracking-widest transition-colors">
                        <i data-lucide="settings" class="w-4 h-4"></i> CONFIGURAÇÕES
                    </button>
                </div>
            </div>
        </div>

        <!-- Content -->
        <div class="flex-grow">
            <!-- Minhas Compras -->
            <div id="tab-compras" class="bg-slate-900/50 border border-slate-800 rounded-2xl p-8 min-h-[400px]">
                <h2 class="font-orbitron font-bold text-xl text-white mb-6 tracking-widest flex items-center justify-between">
                    <span class="flex items-center gap-3"><i data-lucide="shopping-bag" class="text-electricblue"></i> SEUS JOGOS</span>
                    <button onclick="loadMyOrders()" class="text-xs text-slate-400 hover:text-white flex items-center gap-1 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 hover:border-slate-500 transition-all"><i data-lucide="refresh-cw" class="w-4 h-4"></i> ATUALIZAR STATUS</button>
                </h2>
                
                <div id="my-orders-list" class="space-y-6">
                    <div class="text-center text-slate-500 py-10">
                        <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2"></i> Buscando servidor seguro...
                    </div>
                </div>
            </div>

            <!-- Configurações -->
            <div id="tab-configuracoes" class="hidden bg-slate-900/50 border border-slate-800 rounded-2xl p-8 min-h-[400px]">
                <h2 class="font-orbitron font-bold text-xl text-white mb-6 tracking-widest flex items-center gap-3">
                    <i data-lucide="settings" class="text-cyberrose"></i> CONFIGURAÇÕES DE SEGURANÇA
                </h2>

                <div id="settings-alert" class="hidden mb-6 p-4 rounded-lg text-sm font-bold border"></div>

                <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                    <h3 class="text-white font-bold mb-2">Redefinição de Senha</h3>
                    <p class="text-slate-400 text-sm mb-6">Enviaremos um link seguro para o seu e-mail cadastrado. Clique no link para criar uma nova senha para a sua conta.</p>
                    
                    <button onclick="requestPasswordReset()" class="flex items-center gap-2 bg-slate-800 hover:bg-cyberrose text-white px-6 py-3 rounded-lg font-orbitron text-xs tracking-widest transition-colors border border-slate-700 hover:border-cyberrose">
                        <i data-lucide="mail-warning" class="w-4 h-4"></i> ENVIAR LINK DE REDEFINIÇÃO
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- CHAT MODAL -->
    <div id="chat-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4 sm:p-6 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="absolute inset-0 bg-slate-950/90 backdrop-blur-md" onclick="closeChat()"></div>
        <div class="relative w-full max-w-2xl bg-slate-900 border border-slate-700/80 rounded-2xl shadow-2xl overflow-hidden transform scale-95 transition-transform duration-300 h-[80vh] flex flex-col" id="chat-content">
            
            <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-950/80">
                <h3 class="font-orbitron font-bold text-white flex items-center gap-2">
                    <i data-lucide="headset" class="w-5 h-5 text-electricblue"></i> 
                    SUPORTE TÉCNICO - <span id="chat-modal-title" class="text-slate-400 text-xs"></span>
                </h3>
                <button onclick="closeChat()" class="text-slate-400 hover:text-white transition-colors bg-slate-800 hover:bg-cyberrose rounded-full p-1 border border-slate-700">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div id="user-chat-messages" class="flex-grow p-4 overflow-y-auto space-y-4 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] bg-opacity-5">
                <!-- Messages go here -->
            </div>
            
            <form id="user-chat-form" class="p-4 border-t border-slate-800 bg-slate-950/80 flex gap-2">
                <input type="text" id="user-chat-input" placeholder="Escreva sua mensagem..." class="flex-grow bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-electricblue transition-all">
                <button type="submit" class="bg-electricblue hover:bg-blue-500 text-white px-6 rounded-lg font-orbitron font-bold shadow-cyber flex items-center gap-2">
                    ENVIAR <i data-lucide="send" class="w-4 h-4"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let currentChatOrderId = null;
        let chatInterval = null;

        // Fetch User Data
        fetch('/api/me')
            .then(res => res.json())
            .then(data => {
                if(data.email) document.getElementById('user-email').innerText = data.email;
                if(data.isAdmin) document.getElementById('nav-admin-btn').classList.remove('hidden');
            });

        function switchTab(tab) {
            const compras = document.getElementById('tab-compras');
            const conf = document.getElementById('tab-configuracoes');
            const btnCompras = document.getElementById('btn-compras');
            const btnConf = document.getElementById('btn-configuracoes');

            if(tab === 'compras') {
                compras.classList.remove('hidden');
                conf.classList.add('hidden');
                btnCompras.className = "w-full flex items-center gap-3 px-4 py-3 rounded-lg bg-electricblue/10 text-electricblue font-orbitron text-xs tracking-widest transition-colors";
                btnConf.className = "w-full flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white font-orbitron text-xs tracking-widest transition-colors";
                loadMyOrders();
            } else {
                conf.classList.remove('hidden');
                compras.classList.add('hidden');
                btnConf.className = "w-full flex items-center gap-3 px-4 py-3 rounded-lg bg-cyberrose/10 text-cyberrose font-orbitron text-xs tracking-widest transition-colors";
                btnCompras.className = "w-full flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white font-orbitron text-xs tracking-widest transition-colors";
            }
        }

        // --- MY ORDERS LOGIC ---
        async function loadMyOrders() {
            try {
                const res = await fetch('/api/my-orders');
                const orders = await res.json();
                
                const container = document.getElementById('my-orders-list');
                if(orders.length === 0) {
                    container.innerHTML = `
                        <div class="flex flex-col items-center justify-center text-center h-64 border-2 border-dashed border-slate-800 rounded-xl bg-slate-900/20">
                            <i data-lucide="package-open" class="w-12 h-12 text-slate-600 mb-4"></i>
                            <h3 class="text-lg font-bold text-slate-300">Nenhuma compra encontrada</h3>
                            <p class="text-slate-500 text-sm mt-2 max-w-sm">Você ainda não possui jogos na sua biblioteca.</p>
                            <a href="/" class="mt-6 px-6 py-2 bg-electricblue hover:bg-blue-600 text-white rounded font-orbitron text-xs tracking-widest transition-colors">EXPLORAR CATÁLOGO</a>
                        </div>
                    `;
                    lucide.createIcons();
                    return;
                }

                let html = '';
                orders.forEach(o => {
                    const isApproved = o.status === 'approved';
                    const statusColor = isApproved ? "bg-emerald-900/40 border-emerald-500 text-emerald-400" : "bg-slate-800 border-slate-600 text-slate-400";
                    const statusIcon = isApproved ? "check-circle" : "clock";
                    const statusText = isApproved ? "PAGAMENTO APROVADO" : (o.status === 'rejected' ? "PAGAMENTO RECUSADO" : "AGUARDANDO PAGAMENTO");

                    let itemsHtml = '';
                    o.items.forEach(item => {
                        let keyBox = '';
                        if (isApproved && item.activation_key) {
                            const keyId = `key-${o.id}-${item.title.replace(/\s+/g, '')}`;
                            keyBox = `
                                <div class="mt-3 p-3 bg-emerald-950/50 border border-emerald-800/50 rounded-lg flex items-center justify-between group">
                                    <div class="flex items-center gap-2">
                                        <i data-lucide="key" class="w-4 h-4 text-emerald-400"></i>
                                        <span id="${keyId}" class="font-orbitron font-bold text-emerald-300 tracking-wider filter blur-sm transition-all duration-300 select-none">${item.activation_key}</span>
                                    </div>
                                    <div class="flex gap-2">
                                        <button onclick="toggleKeyVisibility('${keyId}', this)" class="text-xs text-emerald-500 hover:text-emerald-300 bg-emerald-900/30 px-2 py-1 rounded flex items-center justify-center" title="Mostrar/Ocultar"><i data-lucide="eye" class="w-4 h-4"></i></button>
                                        <button onclick="copyToClipboard('${item.activation_key}')" class="text-xs text-emerald-500 hover:text-emerald-300 bg-emerald-900/30 px-2 py-1 rounded">COPIAR</button>
                                    </div>
                                </div>
                            `;
                        } else if (isApproved) {
                             keyBox = `<div class="mt-2 text-xs text-slate-500">Chave em processamento. Abra o suporte.</div>`;
                        }

                        itemsHtml += `
                            <div class="flex items-center gap-4 bg-slate-900/50 p-3 rounded-lg border border-slate-800 mt-3">
                                <img src="${item.image}" class="w-16 h-16 object-cover rounded-md">
                                <div class="flex-grow">
                                    <div class="text-xs text-electricblue font-orbitron tracking-widest uppercase">${item.category}</div>
                                    <div class="font-bold text-slate-200">${item.title} (x${item.quantity})</div>
                                    ${keyBox}
                                </div>
                            </div>
                        `;
                    });

                    html += `
                        <div class="bg-slate-950 border border-slate-800 rounded-xl p-5 shadow-lg relative overflow-hidden">
                            ${isApproved ? '<div class="absolute top-0 left-0 w-1 h-full bg-emerald-500"></div>' : '<div class="absolute top-0 left-0 w-1 h-full bg-slate-600"></div>'}
                            
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4 pl-3">
                                <div>
                                    <span class="font-orbitron font-bold text-white text-lg">#PEDIDO-${o.id}</span>
                                    <div class="text-sm font-bold text-cyberrose mt-1">R$ ${parseFloat(o.total_amount).toFixed(2).replace('.', ',')}</div>
                                </div>
                                <div class="flex flex-col sm:items-end gap-2">
                                    <span class="flex items-center gap-2 font-orbitron text-[10px] tracking-widest px-3 py-1.5 rounded-full border ${statusColor}">
                                        <i data-lucide="${statusIcon}" class="w-3 h-3"></i> ${statusText}
                                    </span>
                                    <button onclick="openChat(${o.id})" class="text-xs font-orbitron text-slate-400 hover:text-white flex items-center gap-1 hover:bg-slate-800 px-2 py-1 rounded transition-colors"><i data-lucide="message-square" class="w-3 h-3"></i> SUPORTE DO PEDIDO</button>
                                </div>
                            </div>
                            
                            <div class="pl-3">
                                ${itemsHtml}
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
                lucide.createIcons();
            } catch(e) {
                console.error(e);
            }
        }

        window.toggleKeyVisibility = (keyId, btn) => {
            const el = document.getElementById(keyId);
            if(el.classList.contains('blur-sm')) {
                el.classList.remove('blur-sm', 'select-none');
                btn.innerHTML = '<i data-lucide="eye-off" class="w-4 h-4"></i>';
            } else {
                el.classList.add('blur-sm', 'select-none');
                btn.innerHTML = '<i data-lucide="eye" class="w-4 h-4"></i>';
            }
            lucide.createIcons();
        };

        window.copyToClipboard = (text) => {
            navigator.clipboard.writeText(text);
            alert("Chave copiada para a área de transferência!");
        };

        // --- CHAT LOGIC ---
        const modal = document.getElementById('chat-modal');
        const modalContent = document.getElementById('chat-content');

        window.openChat = (orderId) => {
            currentChatOrderId = orderId;
            document.getElementById('chat-modal-title').innerText = "PEDIDO #" + orderId;
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
            document.body.style.overflow = 'hidden';
            
            loadChatMessages();
            chatInterval = setInterval(loadChatMessages, 3000); // Polling simple
        };

        window.closeChat = () => {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.body.style.overflow = '';
            }, 300);
            
            clearInterval(chatInterval);
            currentChatOrderId = null;
        };

        async function loadChatMessages() {
            if(!currentChatOrderId) return;
            try {
                const res = await fetch(`/api/orders/${currentChatOrderId}/chat`);
                const messages = await res.json();
                
                const container = document.getElementById('user-chat-messages');
                container.innerHTML = '';
                
                if(messages.length === 0) {
                    container.innerHTML = `
                        <div class="h-full flex flex-col items-center justify-center text-slate-500 opacity-50">
                            <i data-lucide="headset" class="w-12 h-12 mb-3"></i>
                            <p class="font-orbitron text-xs tracking-widest">ENVIE UMA MENSAGEM PARA INICIAR O SUPORTE</p>
                        </div>
                    `;
                    lucide.createIcons();
                    return;
                }

                messages.forEach(m => {
                    const isUser = m.sender_type === 'user';
                    const alignClass = isUser ? 'justify-end' : 'justify-start';
                    const bubbleClass = isUser ? 'bg-electricblue text-white rounded-br-none' : 'bg-slate-800 text-slate-200 border border-slate-700 rounded-bl-none';
                    const senderName = isUser ? 'VOCÊ' : 'ZHER KEYS';

                    container.innerHTML += `
                        <div class="flex ${alignClass}">
                            <div class="max-w-[80%] ${bubbleClass} p-3 rounded-xl shadow-lg relative">
                                <div class="text-[9px] font-orbitron opacity-50 mb-1">${senderName}</div>
                                <div class="text-sm">${m.message}</div>
                            </div>
                        </div>
                    `;
                });
                // Auto scroll to bottom
                container.scrollTop = container.scrollHeight;
            } catch(e) {
                console.error(e);
            }
        }

        document.getElementById('user-chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!currentChatOrderId) return;
            
            const input = document.getElementById('user-chat-input');
            const message = input.value.trim();
            if(!message) return;

            input.value = '';

            try {
                const res = await fetch(`/api/orders/${currentChatOrderId}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                
                if(res.ok) {
                    loadChatMessages();
                }
            } catch(err) {
                console.error(err);
            }
        });

        // ========================================
        // PASSWORD RESET
        // ========================================
        async function requestPasswordReset() {
            const email = document.getElementById('user-email').innerText;
            const alertBox = document.getElementById('settings-alert');
            
            try {
                const res = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                
                alertBox.classList.remove('hidden');
                if(!res.ok) {
                    alertBox.className = "mb-6 p-4 rounded-lg text-sm font-bold border bg-red-500/20 text-red-400 border-red-500/50";
                    alertBox.innerText = data.error;
                } else {
                    alertBox.className = "mb-6 p-4 rounded-lg text-sm font-bold border bg-emerald-500/20 text-emerald-400 border-emerald-500/50";
                    alertBox.innerText = data.message;
                }
            } catch(e) {
                alertBox.classList.remove('hidden');
                alertBox.className = "mb-6 p-4 rounded-lg text-sm font-bold border bg-red-500/20 text-red-400 border-red-500/50";
                alertBox.innerText = "Erro de conexão.";
            }
        }

        // INIT
        loadMyOrders();
    </script>
</body>
</html>
