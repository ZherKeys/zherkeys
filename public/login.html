<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/logo.png" type="image/png">
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3654713194554139" crossorigin="anonymous"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZHER KEYS | Acesso Seguro</title>
    <link rel="canonical" href="https://zherkeys.com/login.html" />
    <script src="/tailwind.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <!-- Cloudflare Turnstile -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { orbitron: ['Orbitron', 'sans-serif'], inter: ['Inter', 'sans-serif'] },
                    colors: { obsidian: '#020617', cyberrose: '#F43F5E', electricblue: '#3B82F6' },
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; }
        .mesh-bg {
            background-color: transparent;
            background-image: 
                radial-gradient(at 10% 20%, rgba(59, 130, 246, 0.2) 0px, transparent 50%),
                radial-gradient(at 90% 10%, rgba(244, 63, 94, 0.2) 0px, transparent 50%),
                url('loginbackground.png');
            background-size: cover;
            background-position: center;
        }
        /* Ajuste de responsividade para Turnstile da Cloudflare no celular */
        #turnstile-login-container > div, #turnstile-container > div {
            transform: scale(0.88);
            transform-origin: center center;
        }
        @media (min-width: 380px) {
            #turnstile-login-container > div, #turnstile-container > div {
                transform: scale(1);
            }
        }
    </style>
</head>
<body class="text-slate-200 antialiased mesh-bg min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl p-5 sm:p-8 shadow-2xl relative overflow-hidden">
        
        <div class="text-center mb-8">
            <img src="logo.png" alt="Zher Keys Logo" class="w-16 h-16 object-contain mx-auto rounded-lg shadow-lg border border-slate-700/50 bg-slate-950/40 p-1.5 mb-4 hover:scale-105 transition-transform duration-300">
            <h2 class="font-orbitron font-black text-2xl tracking-widest text-white uppercase">ZHER KEYS</h2>
            <p class="text-slate-400 text-xs font-orbitron tracking-widest mt-1">SECURE TERMINAL LOGIN</p>
        </div>

        <!-- Alertas -->
        <div id="alert-box" class="hidden mb-6 p-3 rounded text-sm text-center font-bold"></div>

        <!-- Tabs -->
        <div class="flex mb-6 border-b border-slate-800">
            <button id="tab-login" onclick="switchTab('login')" class="w-1/2 py-3 font-orbitron text-xs tracking-widest text-white border-b-2 border-electricblue transition-colors">LOGIN</button>
            <button id="tab-register" onclick="switchTab('register')" class="w-1/2 py-3 font-orbitron text-xs tracking-widest text-slate-500 hover:text-white transition-colors">REGISTRO</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-5" onsubmit="handleLogin(event)">
            <div>
                <label class="block text-xs font-orbitron text-slate-400 mb-2 tracking-widest">E-MAIL</label>
                <div class="relative">
                    <i data-lucide="mail" class="w-5 h-5 absolute left-3 top-3 text-slate-500"></i>
                    <input type="email" id="login-email" required class="w-full bg-slate-950 border border-slate-800 rounded-lg py-3 pl-10 pr-4 text-white placeholder-slate-600 focus:outline-none focus:border-electricblue transition-colors" placeholder="agente@zher.com">
                </div>
            </div>
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-xs font-orbitron text-slate-400 tracking-widest">SENHA</label>
                    <a href="#" onclick="showForgotPassword(event)" class="text-[10px] text-slate-500 hover:text-white transition-colors font-inter underline">Esqueceu a senha?</a>
                </div>
                <div class="relative">
                    <i data-lucide="lock" class="w-5 h-5 absolute left-3 top-3 text-slate-500"></i>
                    <input type="password" id="login-password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg py-3 pl-10 pr-4 text-white placeholder-slate-600 focus:outline-none focus:border-electricblue transition-colors" placeholder="••••••••">
                </div>
            </div>
            
            <!-- Anti-Robô Widget para Login -->
            <div id="turnstile-login-container" class="my-4 flex justify-center"></div>
            
            <button type="submit" class="w-full bg-electricblue hover:bg-blue-600 text-white font-orbitron text-xs tracking-widest font-bold py-4 rounded-lg shadow-lg shadow-electricblue/30 transition-all uppercase flex items-center justify-center gap-2">
                INICIAR SESSÃO <i data-lucide="log-in" class="w-4 h-4"></i>
            </button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="space-y-5 hidden" onsubmit="handleRegister(event)">
            <div>
                <label class="block text-xs font-orbitron text-slate-400 mb-2 tracking-widest">E-MAIL</label>
                <div class="relative">
                    <i data-lucide="mail" class="w-5 h-5 absolute left-3 top-3 text-slate-500"></i>
                    <input type="email" id="reg-email" required class="w-full bg-slate-950 border border-slate-800 rounded-lg py-3 pl-10 pr-4 text-white placeholder-slate-600 focus:outline-none focus:border-cyberrose transition-colors" placeholder="agente@zher.com">
                </div>
            </div>
            <div>
                <label class="block text-xs font-orbitron text-slate-400 mb-2 tracking-widest">CRIAR SENHA</label>
                <div class="relative">
                    <i data-lucide="key" class="w-5 h-5 absolute left-3 top-3 text-slate-500"></i>
                    <input type="password" id="reg-password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg py-3 pl-10 pr-4 text-white placeholder-slate-600 focus:outline-none focus:border-cyberrose transition-colors" placeholder="••••••••">
                </div>
            </div>
            
            <!-- Anti-Robô Widget -->
            <div id="turnstile-container" class="my-4 flex justify-center"></div>
            
            <button type="submit" id="btn-register" class="w-full bg-cyberrose hover:bg-rose-600 text-white font-orbitron text-xs tracking-widest font-bold py-4 rounded-lg shadow-lg shadow-cyberrose/30 transition-all uppercase flex items-center justify-center gap-2">
                CRIAR CREDENCIAL <i data-lucide="user-plus" class="w-4 h-4"></i>
            </button>
        </form>

        <!-- Esqueci a Senha Form -->
        <form id="forgot-form" class="space-y-5 hidden" onsubmit="handleForgotPassword(event)">
            <p class="text-slate-400 text-sm text-center mb-4">Digite o e-mail associado à sua conta para receber um link de redefinição.</p>
            <div>
                <label class="block text-xs font-orbitron text-slate-400 mb-2 tracking-widest">E-MAIL DA CONTA</label>
                <div class="relative">
                    <i data-lucide="mail" class="w-5 h-5 absolute left-3 top-3 text-slate-500"></i>
                    <input type="email" id="forgot-email" required class="w-full bg-slate-950 border border-slate-800 rounded-lg py-3 pl-10 pr-4 text-white placeholder-slate-600 focus:outline-none focus:border-orange-500 transition-colors" placeholder="agente@zher.com">
                </div>
            </div>
            <button type="submit" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-orbitron text-xs tracking-widest font-bold py-4 rounded-lg shadow-lg shadow-orange-600/30 transition-all uppercase flex items-center justify-center gap-2">
                ENVIAR RECUPERAÇÃO <i data-lucide="send" class="w-4 h-4"></i>
            </button>
            <div class="text-center mt-4">
                <a href="#" onclick="switchTab('login')" class="text-xs font-orbitron text-slate-500 hover:text-white transition-colors tracking-widest underline">VOLTAR PARA LOGIN</a>
            </div>
        </form>

        <!-- Container de Autenticação Social -->
        <div id="social-auth-container" class="mt-4">
            <!-- Separador -->
            <div class="relative flex py-4 items-center">
                <div class="flex-grow border-t border-slate-800/60"></div>
                <span class="flex-shrink mx-4 text-[9px] font-orbitron text-slate-500 tracking-widest uppercase">Ou conecte-se com</span>
                <div class="flex-grow border-t border-slate-800/60"></div>
            </div>

            <!-- Botões de Redes Sociais -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                <!-- Google -->
                <button onclick="authSocial('google')" class="flex items-center justify-center gap-2 bg-slate-950/80 border border-slate-800 hover:border-slate-700 hover:bg-slate-900 text-slate-300 hover:text-white font-orbitron text-[10px] tracking-widest font-bold py-3 px-4 rounded-xl transition-all shadow-md">
                    <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                    </svg>
                    GOOGLE
                </button>
                <!-- Facebook -->
                <button onclick="authSocial('facebook')" class="flex items-center justify-center gap-2 bg-slate-950/80 border border-slate-800 hover:border-slate-700 hover:bg-slate-900 text-slate-300 hover:text-white font-orbitron text-[10px] tracking-widest font-bold py-3 px-4 rounded-xl transition-all shadow-md">
                    <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="#1877F2" xmlns="http://www.w3.org/2000/svg">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                    FACEBOOK
                </button>
                <!-- Steam -->
                <button onclick="authSocial('steam')" class="flex items-center justify-center gap-2 bg-slate-950/80 border border-slate-800 hover:border-slate-700 hover:bg-[#171a21] text-slate-300 hover:text-white font-orbitron text-[10px] tracking-widest font-bold py-3 px-4 rounded-xl transition-all shadow-md">
                    <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="#ffffff" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 .002C5.373.002.001 5.375.001 12.002c0 5.679 3.951 10.436 9.255 11.696a12.827 12.827 0 0 1-.223-2.184l3.963-2.772a4.428 4.428 0 0 0 2.227.608 4.464 4.464 0 0 0 4.457-4.458 4.465 4.465 0 0 0-4.457-4.459c-2.316 0-4.223 1.761-4.437 4.024L8.272 13.1a6.432 6.432 0 0 1 .01-6.143l3.754 1.545c2.316-.957 5.007.135 5.965 2.451a4.464 4.464 0 0 1-5.965 5.965l-3.754-1.545a6.432 6.432 0 0 1-.01 6.143l5.066 3.542a12.002 12.002 0 0 0 6.662-11c0-6.627-5.373-12-12-12zm3.223 16.458a2.678 2.678 0 0 1-2.674-2.674c0-1.478 1.196-2.674 2.674-2.674 1.477 0 2.673 1.196 2.673 2.674a2.678 2.678 0 0 1-2.673 2.674z"/>
                    </svg>
                    STEAM
                </button>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();

        // Configuração do anti-robô (Cloudflare Turnstile)
        let turnstileRegisterToken = '';
        let turnstileLoginToken = '';
        let turnstileRegisterLoaded = false;
        let turnstileLoginLoaded = false;
        let turnstileSitekey = '';

        async function fetchSitekey() {
            if (turnstileSitekey) return turnstileSitekey;
            try {
                const res = await fetch('/api/config/turnstile');
                const { sitekey } = await res.json();
                turnstileSitekey = sitekey;
                return sitekey;
            } catch(e) {
                console.error("Erro ao buscar sitekey:", e);
                return '1x00000000000000000000AA';
            }
        }

        async function loadLoginTurnstile() {
            if (turnstileLoginLoaded) return;
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            if (isLocal) {
                const el = document.getElementById('turnstile-login-container');
                if (el) el.style.display = 'none';
                return;
            }
            const sitekey = await fetchSitekey();
            if (window.turnstile) {
                window.turnstile.render('#turnstile-login-container', {
                    sitekey: sitekey,
                    theme: 'dark',
                    callback: function(token) {
                        turnstileLoginToken = token;
                    },
                    'expired-callback': function() {
                        turnstileLoginToken = '';
                    }
                });
                turnstileLoginLoaded = true;
            }
        }

        async function loadRegisterTurnstile() {
            if (turnstileRegisterLoaded) return;
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            if (isLocal) {
                const el = document.getElementById('turnstile-container');
                if (el) el.style.display = 'none';
                return;
            }
            const sitekey = await fetchSitekey();
            if (window.turnstile) {
                window.turnstile.render('#turnstile-container', {
                    sitekey: sitekey,
                    theme: 'dark',
                    callback: function(token) {
                        turnstileRegisterToken = token;
                    },
                    'expired-callback': function() {
                        turnstileRegisterToken = '';
                    }
                });
                turnstileRegisterLoaded = true;
            }
        }

        // Carrega o captcha de login imediatamente na inicialização
        setTimeout(loadLoginTurnstile, 500);

        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const forgotForm = document.getElementById('forgot-form');
            const tabLogin = document.getElementById('tab-login');
            const tabReg = document.getElementById('tab-register');
            const alertBox = document.getElementById('alert-box');
            
            alertBox.classList.add('hidden'); // clear alerts
            forgotForm.classList.add('hidden');
            
            // Exibir botões sociais ao alternar abas normais
            const socialAuth = document.getElementById('social-auth-container');
            if (socialAuth) socialAuth.classList.remove('hidden');

            if(tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                tabLogin.classList.add('border-b-2', 'border-electricblue', 'text-white');
                tabLogin.classList.remove('text-slate-500');
                tabReg.classList.remove('border-b-2', 'border-cyberrose', 'text-white');
                tabReg.classList.add('text-slate-500');
                loadLoginTurnstile(); // Carrega Turnstile de login se necessário
            } else {
                regForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                tabReg.classList.add('border-b-2', 'border-cyberrose', 'text-white');
                tabReg.classList.remove('text-slate-500');
                tabLogin.classList.remove('border-b-2', 'border-electricblue', 'text-white');
                tabLogin.classList.add('text-slate-500');
                loadRegisterTurnstile(); // Carrega Turnstile de registro se necessário
            }
        }

        function showAlert(msg, isError) {
            const box = document.getElementById('alert-box');
            box.innerHTML = msg;
            box.className = `mb-6 p-3 rounded text-sm text-center font-bold ${isError ? 'bg-red-500/20 text-red-400 border border-red-500/50' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/50'}`;
            box.classList.remove('hidden');
        }

        async function handleLogin(e) {
            e.preventDefault();
            
            // Validação client-side do Turnstile
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            if(!isLocal && !turnstileLoginToken) {
                showAlert('Por favor, confirme que você não é um robô.', true);
                return;
            }

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, turnstileToken: turnstileLoginToken })
                });
                const data = await res.json();
                
                if(!res.ok) {
                    if(data.error.includes('ativada')) {
                        showAlert(data.error + '<br><a href="#" onclick="handleResend(event)" class="text-xs text-white underline mt-2 inline-block hover:text-electricblue transition-colors">Não recebeu o e-mail? Reenviar verificação</a>', true);
                    } else {
                        showAlert(data.error, true);
                    }
                    if (window.turnstile) window.turnstile.reset('#turnstile-login-container');
                    turnstileLoginToken = '';
                }
                else {
                    showAlert(data.message, false);
                    setTimeout(() => window.location.href = data.redirect, 1000);
                }
            } catch(err) {
                showAlert('Erro de conexão com servidor.', true);
            }
        }

        async function handleResend(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            if(!email) {
                showAlert('Preencha o campo de e-mail para reenviar.', true);
                return;
            }
            
            const link = e.target;
            const originalText = link.innerHTML;
            link.innerHTML = 'Enviando... aguarde';
            link.style.pointerEvents = 'none';
            
            try {
                const res = await fetch('/resend-verification', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                
                if(!res.ok) showAlert(data.error, true);
                else {
                    showAlert(data.message, false);
                }
            } catch(err) {
                showAlert('Erro de conexão com servidor.', true);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            
            // Validação client-side do Turnstile
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            if(!isLocal && !turnstileRegisterToken) {
                showAlert('Por favor, confirme que você não é um robô.', true);
                return;
            }

            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const btn = document.getElementById('btn-register');
            
            const originalHtml = btn.innerHTML;
            btn.innerHTML = 'PROCESSANDO... <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>';
            btn.disabled = true;
            btn.classList.add('opacity-70');
            lucide.createIcons();
            
            try {
                const res = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, turnstileToken: turnstileRegisterToken })
                });
                const data = await res.json();
                
                if(!res.ok) {
                    showAlert(data.error, true);
                    if (window.turnstile) window.turnstile.reset('#turnstile-container');
                    turnstileRegisterToken = '';
                } else {
                    showAlert(data.message, false);
                    document.getElementById('register-form').reset();
                    if (window.turnstile) window.turnstile.reset('#turnstile-container');
                    turnstileRegisterToken = '';
                }
            } catch(err) {
                showAlert('Erro de conexão com servidor.', true);
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
                btn.classList.remove('opacity-70');
                lucide.createIcons();
            }
        }
        async function handleForgotPassword(e) {
            e.preventDefault();
            const email = document.getElementById('forgot-email').value;
            
            try {
                const res = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                
                if(!res.ok) showAlert(data.error, true);
                else {
                    showAlert(data.message, false);
                    document.getElementById('forgot-form').reset();
                }
            } catch(err) {
                showAlert('Erro de conexão.', true);
            }
        }

        function showForgotPassword(e) {
            e.preventDefault();
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-form').classList.add('hidden');
            document.getElementById('forgot-form').classList.remove('hidden');
            
            // Ocultar botões sociais na tela de esqueci a senha
            const socialAuth = document.getElementById('social-auth-container');
            if (socialAuth) socialAuth.classList.add('hidden');
            
            document.getElementById('tab-login').classList.remove('border-b-2', 'border-electricblue', 'text-white');
            document.getElementById('tab-login').classList.add('text-slate-500');
            document.getElementById('tab-register').classList.remove('border-b-2', 'border-cyberrose', 'text-white');
            document.getElementById('tab-register').classList.add('text-slate-500');
            document.getElementById('alert-box').classList.add('hidden');
        }

        // Função de Redirecionamento Social
        function authSocial(provider) {
            window.location.href = `/auth/${provider}`;
        }

        // Clear cart on logout
        if (window.location.search.includes('logout=1')) {
            localStorage.removeItem('zher_cart');
            // Remove from URL so it doesn't keep triggering
            window.history.replaceState({}, document.title, "/login.html");
        }
    </script>
</body>
</html>
